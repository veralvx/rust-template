# cocogitto: Conventional Commits, checked by `just cog` and CI. `just release` bumps, tags
# and writes the changelog (git-cliff, cliff.toml), so cog does neither.

# every commit, not those since the latest tag: with no tag yet, `--from-latest-tag` stops
# with "unable to get any tag", which would fail a new project's first `just checks`
from_latest_tag = false
ignore_merge_commits = true
ignore_fixup_commits = true
disable_changelog = true
branch_whitelist = ["main"]
tag_prefix = "v"
