from_latest_tag = true
ignore_merge_commits = true
ignore_fixup_commits = true
disable_changelog = false
disable_bump_commit = false
branch_whitelist = []
skip_ci = "[skip ci]"
skip_untracked = false
pre_bump_hooks = []
post_bump_hooks = []
tag_prefix = "v"

[git_hooks]

[commit_types]

[changelog]
path = "CHANGELOG.md"
{% if author_email != "" -%}
# Maps a git commit signature (email) to a forge username, so generated
# changelog entries credit a linkable account. Add a line per author.
authors = [
  { signature = "{{author_email}}", username = "{{github_username}}" },
]
{%- else -%}
# Map git commit signatures to forge usernames to credit authors in the
# changelog, e.g.
#   authors = [{ signature = "you@example.com", username = "{{github_username}}" }]
authors = []
{%- endif %}

[bump_profiles]
