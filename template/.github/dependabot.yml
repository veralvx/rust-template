version: 2

# Covers the cargo and github-actions ecosystems only. These are
# version-pinned in this repository and are NOT updated here:
#   - the dprint plugin URLs in dprint.json: `just dprint-update`
#   - flake.lock's nixpkgs and rust-overlay: `nix flake update`
{%- if project_kind != "lib" %}
#   - `cargo-dist-version` in dist-workspace.toml: `dist init` (keep it
#     equal to the dist `nix develop` has)
{%- endif %}
#   - the toolchain in rust-toolchain.toml, which tracks the MSRV
#     deliberately and should move only when you raise `rust-version`
updates:
  # ─── Rust (Cargo) ───────────────────────────────────────────────
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    # `build(deps): ...` -- a changelog entry (cliff.toml), so a release can
    # carry a dependency update; `chore` is left out of the changelog
    commit-message:
      prefix: "build"
      include: "scope"
    labels:
      - "dependencies"
      - "rust"
    groups:
      # Minor and patch updates are batched into a single PR.
      # Major updates are left ungrouped for individual review.
      rust-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 3
      semver-major-days: 7

  # ─── GitHub Actions ─────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "07:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    # `ci(deps): ...` -- nothing a user of the crate meets, so no changelog entry
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "actions"
    groups:
      actions-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 3
