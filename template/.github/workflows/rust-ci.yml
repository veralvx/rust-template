name: Rust CI (check, test, clippy, fmt, docs, miri)

# NOTE: this file is copied verbatim by cargo-generate and is never
# processed by the template engine -- `${{ ... }}` below is a GitHub
# Actions expression, not a placeholder. Anything project-specific must
# therefore be derived at run time, as the MSRV job does below.

on:
  push:
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "clippy.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/rust-ci.yml"
  pull_request:
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "clippy.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/rust-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ["--all-features"]
    steps:
      - uses: actions/checkout@v7

      - name: Install stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: check-${{ matrix.features }}

      - name: Cargo check
        run: cargo check --workspace --all-targets --locked --verbose ${{ matrix.features }}

  test:
    name: Test (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ["--all-features"]
    steps:
      - uses: actions/checkout@v7

      - name: Install stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.features }}

      - name: Cargo test
        run: cargo test --workspace --all-targets --locked --verbose ${{ matrix.features }}

      - name: Cargo test (doctests)
        run: |
          # `--all-targets` silently skips doctests, so they need their own
          # run. But `--doc` exits 101 with "no library targets found" on a
          # binary-only crate, so ask cargo whether any doctests exist
          # before running them. (jq is preinstalled on GitHub runners.)
          set -euo pipefail
          if cargo metadata --no-deps --format-version 1 \
               | jq -e '[.packages[].targets[] | select(.doctest)] | length > 0' > /dev/null; then
            cargo test --workspace --doc --locked ${{ matrix.features }}
          else
            echo "No library target in this package; skipping doctests."
          fi

  miri:
    name: Miri (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ["--all-features"]
    steps:
      - uses: actions/checkout@v7

      - name: Install nightly + miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: miri-${{ matrix.features }}

      - name: cargo miri setup
        run: cargo +nightly miri setup

      - name: cargo miri test
        run: cargo +nightly miri test --workspace --locked --verbose ${{ matrix.features }}

  clippy:
    name: Clippy (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ["--all-features"]
    steps:
      - uses: actions/checkout@v7

      - name: Install stable + clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: clippy-${{ matrix.features }}

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked --verbose ${{ matrix.features }} -- -D warnings

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # dtolnay/rust-toolchain ignores rust-toolchain.toml, so the
      # stable jobs above test the latest stable -- this job is the one
      # that verifies the declared MSRV still builds and passes.
      #
      # The version is read from Cargo.toml rather than pinned here, so
      # `rust-version` stays the single source of truth. A pin in this
      # file would drift the first time the MSRV is raised.
      - name: Read MSRV from Cargo.toml
        id: msrv
        run: |
          set -euo pipefail
          version="$(sed -n 's/^rust-version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' Cargo.toml | head -n 1)"
          if [ -z "$version" ]; then
            echo "::error file=Cargo.toml::no rust-version key found" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "MSRV is $version"

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: msrv-${{ steps.msrv.outputs.version }}

      - name: Check + test on MSRV
        run: |
          cargo check --workspace --all-targets --locked
          cargo test --workspace --locked

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install stable + rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cargo fmt
        run: cargo fmt --all -- --check

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: docs

      - name: cargo doc
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps --all-features --locked
