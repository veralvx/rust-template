name: Dprint Formatting Checks

on:
  push:
    paths:
      # These must match the plugins configured in dprint.json, which
      # are markdown and toml. Listing extensions no plugin handles
      # (yaml, json, Dockerfile) only schedules runs that check nothing.
      # Add a plugin there and an extension here together.
      #
      # GitHub Actions path filters do NOT support brace expansion {a,b}.
      # Each extension must be its own entry.
      - "**/*.md"
      - "**/*.markdown"
      - "**/*.toml"
      - ".github/workflows/style-check-dprint.yml"
      - "dprint.json"
  pull_request:
    paths:
      - "**/*.md"
      - "**/*.markdown"
      - "**/*.toml"
      - ".github/workflows/style-check-dprint.yml"
      - "dprint.json"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dprint:
    name: dprint check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Dprint format check
        uses: dprint/check@v2.3
        with:
          config-path: dprint.json
